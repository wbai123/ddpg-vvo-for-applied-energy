[project]
name = "ieee13-vvo"
version = "0.0.0"
description = "DDPG Volt/VAR control of three regulator taps on the IEEE 13-bus feeder"
requires-python = ">=3.14"
dependencies = [
  "opendssdirect-py==0.9.4",
  "dss-python==0.15.7",
  "torch==2.13.0",
  "numpy==2.5.2",
  "matplotlib==3.11.1",
]

[dependency-groups]
dev = [
    "ipykernel==7.3.0",
    "nbclient==0.11.0",
    "nbconvert==7.17.1",
    "nbformat==5.11.1",
    "pytest==9.1.1",
    "ruff==0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feeder", "src/ddpg", "src/seq_ddpg", "src/reference", "src/seq_reference", "src/datasets", "src/common"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["feeder", "ddpg", "seq_ddpg", "reference", "seq_reference", "datasets", "common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
